version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER}
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - TZ=${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n
    container_name: n8n-app
    restart: unless-stopped
    # 关键1：指定容器运行用户为 UID 1000:GID 1000（n8n默认node用户），解决权限不足问题
    user: "1000:1000"
    environment:
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL}  # 外部访问n8n的URL地址
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_PORT=${N8N_PORT}
      # 数据库连接超时设置（保留原配置）
      - NODE_ENV=production
      # 数据库连接超时设置（保留原配置）
      - DB_POSTGRESDB_POOL_SIZE=2
      - DB_POSTGRESDB_CONNECTION_TIMEOUT=20000
      # 关键2：自动修复config文件权限过宽问题（解决日志中"Permissions 0644 too wide"警告）
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # 若需启用本地目录挂载，需确保本地目录权限为 1000:1000（否则会触发新权限问题）
      - /home/ubuntu/n8n_files:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Cloudflare 隧道服务
  cloudflare-tunnel:
   image: cloudflare/cloudflared:latest
   container_name: cloudflare_tunnel
   restart: unless-stopped
   command:
     - tunnel
     - --no-autoupdate
     - run
     - --token
     - YOUR_CLOUDFLARE_TUNNEL_TOKEN  # 替换为您的Cloudflare隧道令牌
   networks:
     - n8n_network

networks:
  n8n_network:
    driver: bridge

volumes:
  # 外部数据卷（需确保已提前创建：docker volume create postgres_data / docker volume create n8n_data）
  postgres_data:
    #external: true
  n8n_data:
    #external: true